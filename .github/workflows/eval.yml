name: prompt-eval-gate

on:
  pull_request:
    paths:
      - "prompts/v*.txt" # only prompt versions; judge_*.txt is advisory and doesn't trigger CI
  workflow_dispatch: # manual run from the Actions tab
    inputs:
      version:
        description: "Prompt version to gate, e.g. v2"
        required: true

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true # a newer push cancels the old run and saves API quota

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1" # stream progress lines live instead of at the end
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so we can diff against the PR base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14" # matches your laptop. If this step fails, use "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      - name: Unit tests (free, no API calls, no secrets)
        run: python -m pytest

      - name: Pick prompt versions to gate
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "$INPUT_VERSION" =~ ^v[0-9]+$ ]] || { echo "bad version: $INPUT_VERSION"; exit 2; }
            versions="$INPUT_VERSION"
          else
            files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'prompts/v*.txt')
            versions=$(for f in $files; do basename "$f" .txt; done | tr '\n' ' ')
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Gating: $versions"

      - name: Regression gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # only this step can see the key
          VERSIONS: ${{ steps.pick.outputs.versions }}
        run: |
          if [ -z "$VERSIONS" ]; then
            echo "No prompt versions to gate, nothing to do"
            exit 0
          fi
          for v in $VERSIONS; do
            python -m src.gate check "$v"
          done
