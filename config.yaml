# One profile per model. call_model() takes ONE profile.
# price_* = USD per 1M tokens, approximate (check groq.com/pricing). Groq's free
# tier bills you $0, but we log paid-equivalent cost so cost tracking means something.
# gpt-oss models are REASONING models: hidden "thinking" tokens count against
# max_tokens, so keep it high or you get empty replies.

tested:
  provider: groq
  model: openai/gpt-oss-20b
  temperature: 0
  max_tokens: 1024
  reasoning_effort: low
  price_per_1m_input: 0.075
  price_per_1m_output: 0.30

judge:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 0
  max_tokens: 1024
  reasoning_effort: low
  price_per_1m_input: 0.15
  price_per_1m_output: 0.60

tested_ollama:
  provider: ollama
  model: llama3.2
  base_url: http://localhost:11434
  temperature: 0
  max_tokens: 200
  price_per_1m_input: 0
  price_per_1m_output: 0
